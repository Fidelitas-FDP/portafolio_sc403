# --- Resend Mail Configuration ---
resend.api.key=${RESEND_API_KEY}
resend.sender.email=${RESEND_SENDER_EMAIL}
resend.sender.name=${RESEND_SENDER_NAME}

#############################################################

# --- debugging ---
# valores: none, update, validate, create-drop, viable 
spring.jpa.hibernate.ddl-auto=validate

# never = bajo ninguna circumstancia corre scripts dentro de /resources
# valores:  always, never
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# mostrar queries sql en output
spring.jpa.show-sql=false

# formato a sql para legibilidad
spring.jpa.properties.hibernate.format_sql=false

# optimizacion para produccion, evita cargar vistas en cada click
spring.thymeleaf.cache=true

# logging.level.org.springframework.security=DEBUG

