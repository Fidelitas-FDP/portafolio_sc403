# --- Base de datos en Aiven ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# para mantener estandar de InnoDB del sql inicial despelgado en aiven
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ajustes para compatibilidad maxima con servicios en la nube
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=900000

#############################################################


# --- Firebase Storage ---
# Esta informacion se utiliza para obtener acceso a su storage.
firebase.bucket.name=sc403-93f53.firebasestorage.app
firebase.storage.path=portafolio
firebase.json.path=firebase
# no se usa por cambios en StorageConfig.java (ruta hardcoded), 
# pero se pone para evitar errores de compilacion
firebase.json.file=firebase-auth.json
#############################################################

